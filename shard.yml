name: rails_settings_cached_cr
version: 0.1.0
crystal: ">= 1.21.0"
description: |
  Порт rails-settings-cached 2.9.5 (huacnlee) на Crystal — 1:1 API.
  Setting.field / cache_prefix / readonly / validates; кэш настроек через
  ActiveSupport::Cache, хранение — ActiveRecord (таблица settings, YAML в
  value совместим байт-в-байт с Ruby Psych).

authors:
  - oleg

dependencies:
  active_record_cr:
    github: OrelSokolov/active_record.cr
    version: ~> 0.1.0
  # Используется напрямую (ActiveSupport::Cache) — объявляем явно;
  # источник совпадает с транзитивным через active_record_cr.
  active_support_cr:
    github: OrelSokolov/active_support.cr
    version: ~> 0.1.0
